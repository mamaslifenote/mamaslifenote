<script>
const SUPABASE_URL="https://bbyauxdtoorummtgnkzj.supabase.co";
const SUPABASE_KEY="sb_publishable_8_Zj5218vMCffmxKOenXCA_K6VtrlPQ";
const ARTICLE_ID="yatagarasu-series-characters";
const STORAGE_KEY="mamas-life-note-liked:"+ARTICLE_ID;

async function loadLikes(){
  const u=`${SUPABASE_URL}/rest/v1/article_likes?article_id=eq.${encodeURIComponent(ARTICLE_ID)}&select=likes`;
  const r=await fetch(u,{headers:{"apikey":SUPABASE_KEY}});
  if(!r.ok) throw new Error();
  const d=await r.json();
  document.getElementById("likeCount").textContent=d.length?d[0].likes:0;
}

async function addLike(){
  if(localStorage.getItem(STORAGE_KEY)) return;
  const b=document.getElementById("likeButton");
  b.disabled=true;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/add_like`,{
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_article_id:ARTICLE_ID})
  });
  if(!r.ok){
    b.disabled=false;
    document.getElementById("likeMessage").textContent="いいねを送信できませんでした。";
    return;
  }
  const n=await r.json();
  localStorage.setItem(STORAGE_KEY,"1");
  document.getElementById("likeCount").textContent=n;
  b.textContent="♥ いいね済み";
  b.classList.add("liked");
  document.getElementById("likeMessage").textContent="ありがとうございます。";
}

const likeButton=document.getElementById("likeButton");
if(localStorage.getItem(STORAGE_KEY)){
  likeButton.textContent="♥ いいね済み";
  likeButton.classList.add("liked");
  likeButton.disabled=true;
}else{
  likeButton.addEventListener("click",addLike);
}
loadLikes().catch(()=>{
  document.getElementById("likeMessage").textContent="いいね数を取得できませんでした。";
});
</script>
