<script>
(function(){
  const list=document.getElementById('diary-list');
  const desc=document.getElementById('sort-desc');
  const asc=document.getElementById('sort-asc');
  function sortDiary(newestFirst){
    const cards=Array.from(list.querySelectorAll('.event'));
    cards.sort((a,b)=>{
      const da=new Date(a.dataset.date);
      const db=new Date(b.dataset.date);
      return newestFirst ? db-da : da-db;
    });
    cards.forEach(card=>list.appendChild(card));
    desc.classList.toggle('active', newestFirst);
    asc.classList.toggle('active', !newestFirst);
    desc.setAttribute('aria-pressed', String(newestFirst));
    asc.setAttribute('aria-pressed', String(!newestFirst));
  }
  desc.addEventListener('click',()=>sortDiary(true));
  asc.addEventListener('click',()=>sortDiary(false));
  sortDiary(true);
})();
</script>
